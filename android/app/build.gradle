plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def veltrixKeystorePath = System.getenv('VELTRIX_KEYSTORE_PATH')
def veltrixKeystorePassword = System.getenv('VELTRIX_KEYSTORE_PASSWORD')

android {
    namespace 'com.veltrix.scanner'
    compileSdk 35

    defaultConfig {
        applicationId 'com.veltrix.scanner'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        if (veltrixKeystorePath && veltrixKeystorePassword) {
            veltrix {
                storeFile file(veltrixKeystorePath)
                storePassword veltrixKeystorePassword
                keyAlias 'veltrix'
                keyPassword veltrixKeystorePassword
            }
        }
    }

    buildTypes {
        debug {
            if (veltrixKeystorePath && veltrixKeystorePassword) {
                signingConfig signingConfigs.veltrix
            }
        }
        release {
            minifyEnabled false
            if (veltrixKeystorePath && veltrixKeystorePassword) {
                signingConfig signingConfigs.veltrix
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.10.0'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.camera:camera-camera2:1.4.1'
    implementation 'androidx.camera:camera-lifecycle:1.4.1'
    implementation 'androidx.camera:camera-view:1.4.1'
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    implementation 'com.google.android.gms:play-services-auth:22.0.0'
}
