name: Automatic App Version

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'admin.html'

permissions:
  contents: write

concurrency:
  group: automatic-app-version
  cancel-in-progress: true

jobs:
  bump-version:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Increase only the changed page version
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          import os
          import subprocess
          from pathlib import Path

          before = os.environ["BEFORE_SHA"]
          after = os.environ["AFTER_SHA"]
          changed = set(subprocess.check_output(
              ["git", "diff", "--name-only", before, after],
              text=True
          ).splitlines())

          pattern = re.compile(r"(const\\s+APP_VERSION\\s*=\\s*['\"])(\\d+)\\.(\\d+)\\.(\\d+)(['\"])")

          def next_version(version):
              major, minor, patch = map(int, version)
              if patch < 9:
                  patch += 1
              elif minor < 9:
                  minor += 1
                  patch = 0
              else:
                  major += 1
                  minor = 0
                  patch = 0
              return f"{major}.{minor}.{patch}"

          for filename in ("index.html", "admin.html"):
              if filename not in changed:
                  print(f"{filename}: tidak berubah, Version tetap.")
                  continue

              path = Path(filename)
              content = path.read_text(encoding="utf-8")
              match = pattern.search(content)
              if not match:
                  raise SystemExit(f"APP_VERSION tidak ditemukan di {filename}")

              old_version = ".".join(match.groups()[1:4])
              new_version = next_version(old_version)
              updated, count = pattern.subn(
                  lambda m: f"{m.group(1)}{new_version}{m.group(5)}",
                  content,
                  count=1
              )
              if count != 1:
                  raise SystemExit(f"Gagal memperbarui Version di {filename}")

              path.write_text(updated, encoding="utf-8")
              print(f"{filename}: {old_version} -> {new_version}")
          PY

      - name: Commit updated version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Tidak ada Version yang perlu diperbarui."
            exit 0
          fi
          git add index.html admin.html
          git commit -m "chore: auto bump separate page versions [skip ci]"
          git push origin HEAD:main
