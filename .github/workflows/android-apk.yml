name: Build VELTRIX Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
      - 'index.html'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare stable VELTRIX signing key
        env:
          VELTRIX_KEYSTORE_BASE64: ${{ secrets.VELTRIX_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$VELTRIX_KEYSTORE_BASE64" ]; then
            echo "Missing repository secret: VELTRIX_KEYSTORE_BASE64"
            exit 1
          fi
          echo "$VELTRIX_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/veltrix-release.jks"
          test -s "$RUNNER_TEMP/veltrix-release.jks"
      - name: Build debug APK
        working-directory: android
        env:
          VELTRIX_KEYSTORE_PATH: ${{ runner.temp }}/veltrix-release.jks
          VELTRIX_KEYSTORE_PASSWORD: ${{ secrets.VELTRIX_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$VELTRIX_KEYSTORE_PASSWORD" ]; then
            echo "Missing repository secret: VELTRIX_KEYSTORE_PASSWORD"
            exit 1
          fi
          gradle assembleDebug
      - name: Publish APK release for in-app updates
        working-directory: android
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="VELTRIX-${VERSION_NAME}.apk"
          cp "$APK" "$RELEASE_APK"
          TAG="v${VERSION_NAME}"
          NOTES="Pembaruan aplikasi VELTRIX.\nVELTRIX_VERSION_CODE=${GITHUB_RUN_NUMBER}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$RELEASE_APK" --clobber
          else
            gh release create "$TAG" "$RELEASE_APK" --title "VELTRIX ${VERSION_NAME}" --notes "$NOTES"
          fi
      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: VELTRIX-Android-APK
          path: android/VELTRIX-*.apk
          if-no-files-found: error
          retention-days: 30
